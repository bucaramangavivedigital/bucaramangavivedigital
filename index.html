<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentManager Pro - Gestión de Arriendos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .status-pill { @apply px-3 py-1 rounded-full text-xs font-semibold transition-all; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navegación / Header -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-blue-600 p-2 rounded-lg">
                        <i class="fas fa-building text-white"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-800">RentManager<span class="text-blue-600">Pro</span></span>
                </div>
                <div class="flex gap-3">
                    <button onclick="toggleConfig()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fas fa-cog"></i> Configurar GitHub
                    </button>
                    <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fas fa-upload"></i> Importar JSON
                        <input type="file" id="importFile" class="hidden" accept=".json">
                    </label>
                    <button onclick="exportData()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fas fa-download"></i> Exportar
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Panel de Configuración GitHub (Oculto por defecto) -->
        <div id="githubConfig" class="hidden mb-8 bg-blue-50 border border-blue-200 p-6 rounded-2xl">
            <h3 class="text-blue-800 font-bold mb-4 flex items-center gap-2">
                <i class="fab fa-github"></i> Sincronización con Repositorio GitHub
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="ghUser" placeholder="Usuario GitHub" class="p-2 rounded border border-blue-200 text-sm">
                <input type="text" id="ghRepo" placeholder="Nombre Repositorio" class="p-2 rounded border border-blue-200 text-sm">
                <input type="password" id="ghToken" placeholder="Personal Access Token (PAT)" class="p-2 rounded border border-blue-200 text-sm">
                <div class="flex gap-2">
                    <button onclick="saveConfig()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1">Conectar</button>
                    <button onclick="loadFromGitHub()" id="loadBtn" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1 hidden">
                        <i class="fas fa-cloud-download-alt"></i> Cargar Datos
                    </button>
                    <button onclick="syncWithGitHub()" id="syncBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1 hidden">
                        <i class="fas fa-cloud-upload-alt"></i> Subir Datos
                    </button>
                </div>
            </div>
            <p class="text-[10px] text-blue-600 mt-2">
                * Los datos se guardarán en <code>data/apartamentos.json</code> y <code>data/movimientos.json</code> en tu repositorio.
            </p>
        </div>

        <!-- Alerta de Sincronización -->
        <div id="syncStatus" class="hidden mb-4 p-3 rounded-lg text-center text-sm font-bold"></div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="stats-container">
            <!-- Dinámico vía JS -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Panel Izquierdo: Registro -->
            <div class="lg:col-span-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fas fa-plus-circle text-blue-500"></i> Nuevo Apartamento
                    </h2>
                    <form id="aptForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Número Apartamento</label>
                            <input type="text" id="aptNum" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Arrendatario</label>
                                <input type="text" id="tenant" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Arrendador</label>
                                <input type="text" id="landlord" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Precio ($)</label>
                                <input type="number" id="price" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Inicio Contrato</label>
                                <input type="date" id="startDate" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
                            <input type="email" id="email" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-100">
                            Registrar Propiedad
                        </button>
                    </form>
                </div>
            </div>

            <!-- Panel Derecho: Gestión Mensual -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Control de Pagos</h2>
                            <p class="text-sm text-slate-500">Gestión de estados por periodo mensual</p>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl">
                            <i class="fas fa-calendar-alt text-slate-400 ml-2"></i>
                            <input type="month" id="monthSelector" class="bg-transparent border-none focus:ring-0 font-bold text-slate-700 outline-none px-2">
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b border-slate-100">
                                <tr>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Apto</th>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase">Arrendatario / Precio</th>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-center">Estado del Mes</th>
                                    <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="apartmentsList" class="divide-y divide-slate-100">
                                <!-- Dinámico vía JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- ESTADO INICIAL ---
        // Separamos lógicamente los datos como pidió el usuario
        let db = {
            apartments: [], // "Archivo" de apartamentos
            payments: {}    // "Archivo" de movimientos
        };

        let config = {
            user: '',
            repo: '',
            token: ''
        };

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('rentData');
            if (savedData) db = JSON.parse(savedData);
            
            const savedConfig = localStorage.getItem('ghConfig');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                document.getElementById('ghUser').value = config.user;
                document.getElementById('ghRepo').value = config.repo;
                document.getElementById('ghToken').value = config.token;
                if (config.token) {
                    document.getElementById('syncBtn').classList.remove('hidden');
                    document.getElementById('loadBtn').classList.remove('hidden');
                }
            }

            // Establecer mes actual por defecto
            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            document.getElementById('monthSelector').value = currentMonth;
            
            render();
        });

        // --- PERSISTENCIA ---
        function save() {
            localStorage.setItem('rentData', JSON.stringify(db));
            render();
        }

        // --- EXPORTAR / IMPORTAR ---
        function exportData() {
            const dataStr = JSON.stringify(db, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `backup_arriendos_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
        }

        document.getElementById('importFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    db = JSON.parse(event.target.result);
                    save();
                    alert('Base de datos restaurada con éxito.');
                } catch (err) {
                    alert('Error al leer el archivo JSON.');
                }
            };
            reader.readAsText(file);
        });

        // --- LÓGICA DE APARTAMENTOS ---
        document.getElementById('aptForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newApt = {
                id: Date.now(),
                num: document.getElementById('aptNum').value,
                tenant: document.getElementById('tenant').value,
                landlord: document.getElementById('landlord').value,
                price: parseFloat(document.getElementById('price').value),
                startDate: document.getElementById('startDate').value,
                email: document.getElementById('email').value
            };
            
            db.apartments.push(newApt);
            e.target.reset();
            save();
        });

        function deleteApt(id) {
            if(confirm('¿Estás seguro de eliminar este apartamento? Se perderán sus registros.')) {
                db.apartments = db.apartments.filter(a => a.id !== id);
                save();
            }
        }

        // --- LÓGICA DE PAGOS ---
        function setStatus(aptNum, status) {
            const month = document.getElementById('monthSelector').value;
            if (!db.payments[month]) db.payments[month] = {};
            db.payments[month][aptNum] = status;
            save();
        }

        // --- RENDERIZADO DE UI ---
        function render() {
            const month = document.getElementById('monthSelector').value;
            const listContainer = document.getElementById('apartmentsList');
            const statsContainer = document.getElementById('stats-container');
            
            listContainer.innerHTML = '';
            
            let totalRecaudado = 0;
            let totalPendiente = 0;
            let totalDesocupados = 0;

            if (db.apartments.length === 0) {
                listContainer.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400 italic">No hay apartamentos registrados.</td></tr>`;
            }

            db.apartments.forEach(apt => {
                const status = (db.payments[month] && db.payments[month][apt.num]) || 'pendiente';
                
                // Cálculos de estadísticas
                if (status === 'pagado') totalRecaudado += apt.price;
                if (status === 'pendiente') totalPendiente += apt.price;
                if (status === 'desocupado') totalDesocupados++;

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition-colors";
                row.innerHTML = `
                    <td class="px-6 py-4 font-bold text-slate-700">${apt.num}</td>
                    <td class="px-6 py-4">
                        <div class="text-sm font-semibold text-slate-800">${apt.tenant}</div>
                        <div class="text-xs text-slate-400">$${apt.price.toLocaleString()}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex justify-center gap-1 bg-slate-100 p-1 rounded-lg w-fit mx-auto">
                            <button onclick="setStatus('${apt.num}', 'pagado')" class="px-3 py-1 rounded-md text-xs font-bold transition-all ${status === 'pagado' ? 'bg-green-500 text-white shadow-sm' : 'text-slate-500 hover:bg-white'}">PAGADO</button>
                            <button onclick="setStatus('${apt.num}', 'pendiente')" class="px-3 py-1 rounded-md text-xs font-bold transition-all ${status === 'pendiente' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-500 hover:bg-white'}">PENDIENTE</button>
                            <button onclick="setStatus('${apt.num}', 'desocupado')" class="px-3 py-1 rounded-md text-xs font-bold transition-all ${status === 'desocupado' ? 'bg-slate-400 text-white shadow-sm' : 'text-slate-500 hover:bg-white'}">VACÍO</button>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteApt(${apt.id})" class="text-slate-300 hover:text-red-500 transition-colors">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                `;
                listContainer.appendChild(row);
            });

            // Actualizar Stats
            statsContainer.innerHTML = `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-green-500 uppercase tracking-wider mb-1">Recaudado (${month})</p>
                    <p class="text-3xl font-black text-slate-800">$${totalRecaudado.toLocaleString()}</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-1">Pendiente por Cobrar</p>
                    <p class="text-3xl font-black text-slate-800">$${totalPendiente.toLocaleString()}</p>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Unidades Desocupadas</p>
                    <p class="text-3xl font-black text-slate-800">${totalDesocupados}</p>
                </div>
            `;
        }

        // Escuchar cambios de mes
        document.getElementById('monthSelector').addEventListener('change', render);

        // --- LÓGICA DE GITHUB (API) ---
        function toggleConfig() {
            document.getElementById('githubConfig').classList.toggle('hidden');
        }

        function saveConfig() {
            config.user = document.getElementById('ghUser').value;
            config.repo = document.getElementById('ghRepo').value;
            config.token = document.getElementById('ghToken').value;
            localStorage.setItem('ghConfig', JSON.stringify(config));
            if (config.token) {
                document.getElementById('syncBtn').classList.remove('hidden');
                document.getElementById('loadBtn').classList.remove('hidden');
            }
            alert('Configuración guardada localmente.');
        }

        async function loadFromGitHub() {
            if (!config.token || !config.repo) return alert('Configura GitHub primero.');
            const status = document.getElementById('syncStatus');
            status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-blue-100 text-blue-700 block";
            status.innerText = "Descargando datos desde GitHub...";

            try {
                // Intentamos obtener los dos archivos
                const apts = await fetchFromGitHub('data/apartamentos.json');
                const pays = await fetchFromGitHub('data/movimientos.json');

                if (apts) db.apartments = apts;
                if (pays) db.payments = pays;

                save(); // Guarda en LocalStorage y renderiza
                status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-green-100 text-green-700 block";
                status.innerText = "¡Datos sincronizados desde la nube con éxito!";
            } catch (err) {
                status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-red-100 text-red-700 block";
                status.innerText = "Error al descargar: " + err.message;
            } finally {
                setTimeout(() => status.classList.add('hidden'), 5000);
            }
        }

        async function fetchFromGitHub(path) {
            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
            const res = await fetch(url, {
                headers: { 'Authorization': `token ${config.token}`, 'Cache-Control': 'no-cache' }
            });
            if (!res.ok) return null;
            const data = await res.json();
            return JSON.parse(decodeURIComponent(escape(atob(data.content))));
        }

        async function syncWithGitHub() {
            if (!config.token || !config.repo) return alert('Configura GitHub primero.');
            
            const syncBtn = document.getElementById('syncBtn');
            const status = document.getElementById('syncStatus');
            syncBtn.disabled = true;
            status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-amber-100 text-amber-700 block";
            status.innerText = "Sincronizando con GitHub (Commiting files)...";

            try {
                // Guardamos apartamentos y movimientos como archivos planos en la carpeta /data
                await uploadToGitHub('data/apartamentos.json', db.apartments);
                await uploadToGitHub('data/movimientos.json', db.payments);
                
                status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-green-100 text-green-700 block";
                status.innerText = "¡Sincronizado! Los archivos planos han sido actualizados en tu repositorio.";
            } catch (err) {
                console.error(err);
                status.className = "mb-4 p-3 rounded-lg text-center text-sm font-bold bg-red-100 text-red-700 block";
                status.innerText = "Error de sincronización: " + err.message;
            } finally {
                syncBtn.disabled = false;
                setTimeout(() => status.classList.add('hidden'), 5000);
            }
        }

        async function uploadToGitHub(path, content) {
            const url = `https://api.github.com/repos/${config.user}/${config.repo}/contents/${path}`;
            const message = `Update ${path} - ${new Date().toLocaleString()}`;
            const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));

            // Intentar obtener el SHA del archivo si ya existe (necesario para actualizar)
            let sha = "";
            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `token ${config.token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    sha = data.sha;
                }
            } catch (e) {}

            const body = {
                message: message,
                content: contentBase64
            };
            if (sha) body.sha = sha;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${config.token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || 'Error al subir a GitHub');
            }
        }

    </script>
</body>
</html>
